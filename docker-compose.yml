services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: protokol
            POSTGRES_PASSWORD: protokol
            POSTGRES_DB: protokol
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U protokol -d protokol"]
            interval: 5s
            timeout: 5s
            retries: 10
    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            NODE_ENV: development
            DATABASE_HOST: postgres
            DATABASE_PORT: 5432
            DATABASE_USERNAME: protokol
            DATABASE_PASSWORD: protokol
            DATABASE_NAME: protokol
        depends_on:
            postgres:
                condition: service_healthy
        # Alternatively, provide your own variables with:
        # env_file: .env

volumes:
    postgres_data:
